<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Semi-transparent map</title>
    <desc>
        The map must be read with non-premultiplied color values, so a half-transparent
        white map moves pixels like an opaque one: scale * 0.5 = 10 px up and left.
        The blue rect should match the dashed red outline.
    </desc>

    <filter id="filter1" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse"
            color-interpolation-filters="sRGB">
        <feFlood id="feFlood1" flood-color="#ffffff" flood-opacity="0.5" result="map"/>
        <feDisplacementMap id="feDisplacementMap1" in="SourceGraphic" in2="map" scale="20"
                           xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <rect id="rect1" x="50" y="50" width="100" height="100" fill="blue" filter="url(#filter1)"/>
    <rect id="expected" x="40" y="40" width="100" height="100" fill="none"
          stroke="red" stroke-dasharray="4"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
