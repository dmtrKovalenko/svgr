[package]
name = "usvgr"
version = "0.46.1"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>"]
keywords = ["svg"]
license = "MPL-2.0"
edition = "2021"
description = "An SVG simplification library."
categories = ["multimedia::images"]
repository = "https://github.com/RazrFalcon/svgr"
documentation = "https://docs.rs/usvgr/"
readme = "README.md"
exclude = ["tests"]
workspace = "../.."

[[bin]]
name = "usvgr"
required-features = ["svgz", "text", "system-fonts", "memmap-fonts", "writer"]

[dependencies]
base64 = { version = "0.22", optional = true } # for embedded images
log = "0.4"
strict-num = "0.1.1"
svgrtypes = { version = "0.46.1", path = "../svgrtypes" }
tiny-skia-path = "0.12.0"
xmlwriter = { version = "0.1", optional = true }

# parser
data-url = "0.3" # for href parsing
flate2 = { version = "1.1", default-features = false, features = [
	"rust_backend",
], optional = true } # SVGZ decoding
kurbo = "0.13" # Bezier curves utils
roxmltree = "0.20.0"
simplecss = "0.2"
siphasher = "1.0.1" # perfect hash implementation

# text
fontdb = { version = "0.23.0", default-features = false, optional = true }
rustybuzz = { version = "0.20.1", optional = true }
# Note: ttf-parser is re-exported from rustybuzz, but we need gvar-alloc for variable fonts
# with many variation axes (like Roboto Flex which has 13 axes)
ttf-parser = { version = "0.25.1", features = ["gvar-alloc"], optional = true }
unicode-bidi = { version = "0.3", optional = true }
unicode-script = { version = "0.5", optional = true }
unicode-vo = { version = "0.1", optional = true }
png = { version = "0.17", optional = true } # color font bitmap glyphs

# fframes 
self-rust-tokenize = { version = "0.3.4", optional = true }
quote = { version = "1.0.35", optional = true }
lru = "0.14.0"
ahash = "0.8.11"
pico-args = { version = "0.5", features = ["eq-separator"] }
smallvec = "1.15.1"

[dev-dependencies]
once_cell = "1.5"

[features]
default = ["svgz", "text", "system-fonts", "memmap-fonts", "writer"]
# Enables SVGZ decoding
svgz = ["flate2"]
# Enables text-to-path conversion support.
# Adds around 400KiB to your binary.
text = ["fontdb", "rustybuzz", "ttf-parser", "unicode-bidi", "unicode-script", "unicode-vo", "png", "writer"]
# Enables system fonts loading.
system-fonts = ["fontdb/fs", "fontdb/fontconfig"]
# Enables font files memmaping for faster loading.
memmap-fonts = ["fontdb/memmap"]
# Enables support for inlining svgtrees in proc macro
proc-macro = ["quote", "self-rust-tokenize"]
# Enables converting trees back to SVG.
writer = ["xmlwriter", "base64"]
